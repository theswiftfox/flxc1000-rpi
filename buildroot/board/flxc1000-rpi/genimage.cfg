/* FLXC1000 RPi4 SD card image layout
 *
 *   P1  boot.vfat   64 MiB  — kernel, dtb, firmware, initramfs
 *   P2  app.ext4    64 MiB  — application binary (flxc1000-app)
 *   P3  data.ext4   16 MiB  — persistent data (boot_state, etc.)
 */

image boot.vfat {
    vfat {
        files = {
            "bcm2711-rpi-4-b.dtb",
            "Image",
            "config.txt",
            "start4.elf",
            "fixup4.dat",
            "rootfs.cpio.lz4"
        }
    }
    size = 128M
}

image app.ext4 {
    ext4 {
        label = "app"
    }
    mountpoint = "/app"
    size = 64M
}

image data.ext4 {
    ext4 {
        label = "data"
    }
    mountpoint = "/data"
    size = 16M
}

image sdcard.img {
    hdimage {
        align = 4M
    }
    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }
    partition app {
        partition-type = 0x83
        image = "app.ext4"
    }
    partition data {
        partition-type = 0x83
        image = "data.ext4"
    }
}
