[workspace]
resolver = "2"
members = ["flxc1000-init", "flxc1000-boot", "flxc1000-app", "flxc1000-doip"]

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "io-util",
    "process",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror = "2"
bytes = "1"
rppal = "0.19"
nix = { version = "0.29", features = ["mount", "process", "fs", "signal"] }
heapless = "0.9"

# ace — Automotive Communication Engine (UDS server + DoIP codecs)
ace-server = { git = "https://github.com/samp-reston/ace.git", rev = "0706bef625fbde1d8fadbd84ea21bb8ee650f7e4", features = [
    "std",
] }
ace-doip = { git = "https://github.com/samp-reston/ace.git", rev = "0706bef625fbde1d8fadbd84ea21bb8ee650f7e4", features = [
    "std",
] }
ace-sim = { git = "https://github.com/samp-reston/ace.git", rev = "0706bef625fbde1d8fadbd84ea21bb8ee650f7e4", features = [
    "std",
] }

flxc1000-doip = { path = "flxc1000-doip" }
